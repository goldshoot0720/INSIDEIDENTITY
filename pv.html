<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside Identity PV</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #f6eef0; overflow: hidden;
    font: 14px/1.4 "Hiragino Sans", "PingFang TC", sans-serif; }
  body { display: grid; place-items: center; }
  #pv { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; display: block; background: #000; }
  #ui { position: fixed; left: 50%; bottom: 16px; translate: -50% 0; display: flex; gap: 10px; align-items: center;
    padding: 10px 14px; border-radius: 14px; background: rgba(18, 2, 8, 0.86); border: 1px solid rgba(255,255,255,.14);
    width: min(940px, calc(100vw - 32px)); box-sizing: border-box; transition: opacity .4s; }
  #ui.idle { opacity: 0; }
  #ui select, #ui button { font: inherit; color: #fff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; max-width: 260px; }
  #ui button:hover { border-color: #ff4d6a; }
  #seek { flex: 1; min-width: 80px; accent-color: #ff4d6a; }
  #time { font: 13px Menlo, monospace; white-space: nowrap; }
  #ui a { color: #ffb3c2; font-size: 13px; white-space: nowrap; }
  #menu { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(12, 0, 6, 0.9); z-index: 2; overflow-y: auto; }
  #menu[hidden] { display: none; }
  #menu .inner { width: min(980px, calc(100vw - 32px)); padding: 24px 0; }
  #menu h1 { font: 900 30px/1.1 "Hiragino Maru Gothic ProN", sans-serif; margin: 0 0 6px; }
  #menu h1 span { color: #ff4d6a; }
  #menu p { color: #c9a9b2; margin: 0 0 18px; }
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  #list button { text-align: left; font: inherit; color: inherit; background: #23070f; border: 1px solid #4a1626; border-radius: 12px;
    padding: 14px 16px; cursor: pointer; }
  #list button:hover { border-color: #ff4d6a; background: #321019; }
  #list small { color: #c98d9c; display: block; font-size: 11px; letter-spacing: 2px; }
  #list strong { display: block; margin: 4px 0; font-size: 16px; }
  #list span { color: #d8bcc4; font-size: 13px; }
  code { background: rgba(255,255,255,.1); padding: 1px 5px; border-radius: 4px; }
  body.render #ui, body.render #menu { display: none; }
  @media (max-width: 640px) { #ui { flex-wrap: wrap; } #seek { order: 5; flex-basis: 100%; } }
</style>
</head>
<body>
<canvas id="pv" width="1920" height="1080" aria-label="PV"></canvas>
<div id="ui">
  <button id="menuBtn">☰ 選歌</button>
  <select id="song" aria-label="歌曲"></select>
  <button id="play">▶ 播放</button>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放位置">
  <span id="time">0:00 / 0:00</span>
  <a href="index.html">舞台 →</a>
</div>
<div id="menu" hidden>
  <div class="inner">
    <h1>INSIDE <span>IDENTITY</span> · PV</h1>
    <p>選一首歌播放 PV。Space 暫停 · ← → 快轉 5 秒 · N / P 下一首 / 上一首 · F 全螢幕 · Esc 回選單。
      MP4 成品：<code>node tools/render-pv.mjs</code></p>
    <div id="list"></div>
  </div>
</div>
<script type="module" src="js/pv.js"></script>
</body>
</html>
