<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside Identity Dance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0006;
    --panel: rgba(18, 2, 8, 0.92);
    --line: rgba(255, 255, 255, 0.14);
    --text: #f6eef0;
    --muted: #b99aa2;
    --red: #d3143a;
    --red-2: #ff4d6a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Shippori Mincho B1", "Hiragino Sans", "PingFang TC", system-ui, sans-serif; }
  body { display: grid; grid-template-columns: minmax(0, 1fr) 320px; grid-template-rows: 100vh; height: 100vh; overflow: hidden; }
  body.bare { grid-template-columns: minmax(0, 1fr); }
  body.bare #panel { display: none; }
  #stage { position: relative; min-height: 0; min-width: 0; height: 100%; background: #000; overflow: hidden; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  #panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; height: 100vh; padding: 18px 16px 28px; }
  h1 { font: 900 22px/1.1 "Cinzel", serif; letter-spacing: .06em; margin: 0 0 2px; }
  h1 span { color: var(--red-2); }
  .sub { color: var(--muted); margin: 0 0 14px; font-size: 13px; }
  section { border-top: 1px solid var(--line); padding: 12px 0; }
  section > b { display: block; font-size: 12px; letter-spacing: .12em; color: var(--muted); margin-bottom: 8px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  button, .file, select, input[type=number] {
    font: inherit; color: var(--text); background: rgba(255,255,255,.06); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 10px; cursor: pointer; }
  button:hover, .file:hover { border-color: var(--red-2); }
  button.on, .seg button.on { background: var(--red); border-color: var(--red); color: #fff; }
  button.primary { background: var(--red); border-color: var(--red); font-weight: 800; }
  button.on#rec { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .55; } }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .row > * { flex: 1 1 auto; }
  .file { display: block; text-align: center; }
  .file input { display: none; }
  input[type=number] { width: 80px; cursor: text; }
  label.ck { display: flex; gap: 8px; align-items: center; margin: 5px 0; cursor: pointer; }
  label.ck input { accent-color: var(--red); width: 16px; height: 16px; }
  textarea { width: 100%; min-height: 90px; resize: vertical; font: 12px/1.4 ui-monospace, Menlo, monospace;
    background: rgba(0,0,0,.35); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  #status { color: #ffd2da; font-size: 13px; min-height: 2.6em; margin: 6px 0 0; }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0; }
  kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .only-camera, .only-video, .only-dance { display: none; }
  body[data-mode=camera] .only-camera, body[data-mode=video] .only-video, body[data-mode=dance] .only-dance { display: block; }
  #srcVideo, #camVideo { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  @media (max-width: 820px) {
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 56.25vw minmax(0, 1fr); }
    body.bare { grid-template-rows: 100vh; }
    #panel { height: auto; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body data-mode="dance">
<div id="stage">
  <canvas id="view" aria-label="舞台"></canvas>
  <video id="srcVideo" playsinline crossorigin="anonymous"></video>
  <video id="camVideo" playsinline muted></video>
</div>

<aside id="panel">
  <h1>INSIDE <span>IDENTITY</span></h1>
  <p class="sub">動作模仿 MV · 4 人舞台</p>

  <section>
    <b>模式</b>
    <div class="seg">
      <button data-mode="dance" class="on">自動舞蹈</button>
      <button data-mode="camera">鏡頭模仿</button>
      <button data-mode="video">影片模仿</button>
    </div>
    <div class="only-camera">
      <p class="hint">用網路攝影機即時捕捉你的動作，4 位角色一起模仿。多人入鏡時會各自對應。</p>
      <div class="row"><button id="cam" class="primary">開啟鏡頭</button></div>
    </div>
    <div class="only-video">
      <p class="hint">載入舞蹈影片（例如你手上的 MV 檔），角色會模仿影片中的人，影片聲音即為配樂。</p>
    </div>
    <label class="file">載入舞蹈影片…<input id="videoFile" type="file" accept="video/*"></label>
    <div class="only-dance">
      <div class="row">
        <select id="only" aria-label="動作"><option value="">完整編舞（循環）</option></select>
      </div>
    </div>
  </section>

  <section>
    <b>播放</b>
    <div class="row">
      <button id="play" class="primary">▶ 播放</button>
      <button id="restart">⟲ 從頭</button>
    </div>
    <label class="file">載入音樂…<input id="audioFile" type="file" accept="audio/*"></label>
    <div class="row">
      BPM <input id="bpm" type="number" value="180" min="40" max="300">
      <button id="tap">TAP</button>
    </div>
    <div class="row">偏移(秒) <input id="offset" type="number" value="0" step="0.01"></div>
    <p id="status">載入角色中…</p>
  </section>

  <section>
    <b>選項</b>
    <label class="ck"><input type="checkbox" id="mvcam"> MV 運鏡（自動特寫切換）</label>
    <label class="ck"><input type="checkbox" id="title"> 開頭標題卡</label>
    <label class="ck"><input type="checkbox" id="mirror"> 鏡像（自拍視角）</label>
    <label class="ck"><input type="checkbox" id="legs"> 追蹤腿部</label>
    <label class="ck"><input type="checkbox" id="depth"> 手臂前後伸縮</label>
    <label class="ck"><input type="checkbox" id="pip"> 顯示來源小畫面</label>
    <label class="ck"><input type="checkbox" id="skeleton"> 顯示骨架</label>
    <div class="row">
      <select id="follow" aria-label="對應方式">
        <option value="each">每位角色對應一個人（左→右）</option>
        <option value="one">全員模仿同一個人</option>
      </select>
    </div>
  </section>

  <section>
    <b>字幕（LRC，可選）</b>
    <textarea id="lrc" placeholder="[00:12.30]自己的歌詞或台詞&#10;[00:15.80]下一行…"></textarea>
    <p class="hint">貼上有時間標記的字幕，會顯示在畫面下方並以直排大字呈現。</p>
  </section>

  <section>
    <b>輸出</b>
    <div class="row">
      <button id="rec">● 錄影</button>
      <button id="full">全螢幕</button>
      <button id="hide">隱藏面板</button>
    </div>
    <p class="hint">
      <kbd>Space</kbd> 播放/暫停 · <kbd>T</kbd> 對拍 · <kbd>R</kbd> 從頭 · <kbd>H</kbd> 隱藏面板 · <kbd>F</kbd> 全螢幕<br>
      <kbd>1</kbd>–<kbd>4</kbd> 特寫 · <kbd>G</kbd> 全體 · <kbd>W</kbd> 橫移 · <kbd>A</kbd> 自動運鏡 · <kbd>S</kbd> 骨架
    </p>
  </section>
</aside>

<script type="module" src="js/main.js"></script>
</body>
</html>
